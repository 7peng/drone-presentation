<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presenter View</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&amp;family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<style>
  :root { --amber: #a36a00; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font-family: var(--sans); height: 100vh; display: grid; grid-template-rows: auto 1fr auto; -webkit-font-smoothing: antialiased; }
  header { display: flex; align-items: center; gap: 28px; padding: 18px 26px; border-bottom: 1px solid var(--line); }
  #clock { font: 500 52px var(--heading); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  #pace { font: 600 13px var(--sans); letter-spacing: .1em; text-transform: uppercase; padding: 7px 12px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
  #pace.ok { color: var(--blue); } #pace.warn { color: var(--amber); } #pace.over { color: #fff; background: var(--warn); border-color: var(--warn); }
  .spacer { flex: 1; }
  #where { text-align: right; font-size: 14px; color: var(--muted); line-height: 1.6; }
  #where b { color: var(--ink); font: 600 22px var(--heading); }
  main { padding: 26px 32px; overflow: auto; font-size: 24px; line-height: 1.65; max-width: 1100px; }
  main ul { padding-left: 1.1em; } main li { margin: .35em 0; }
  footer { display: flex; gap: 12px; padding: 14px 26px; border-top: 1px solid var(--line); }
  button { font: 500 15px var(--heading); color: var(--ink); background: #fff; border: 1px solid #bcc8d4; border-radius: 5px; padding: 10px 18px; cursor: pointer; }
  button:hover { background: var(--wash); }
  #waiting { color: var(--muted); }
</style>
</head>
<body>
<header>
  <div id="clock">0:00</div>
  <div id="pace">not started</div>
  <div class="spacer"></div>
  <div id="where"><span id="waiting">Waiting for the deck window… (press P there)</span></div>
</header>
<main id="notes"></main>
<footer>
  <button id="prev">← Back</button>
  <button id="next">Next →</button>
  <div class="spacer"></div>
  <button id="reset">Reset timer</button>
</footer>
<script>
  const ch = new BroadcastChannel('deck');
  const $ = (id) => document.getElementById(id);
  const TOTAL = 5 * 60;
  let state = null;

  const fmt = (s) => `${s < 0 ? '-' : ''}${Math.floor(Math.abs(s) / 60)}:${String(Math.floor(Math.abs(s) % 60)).padStart(2, '0')}`;

  ch.onmessage = (e) => {
    if (e.data.type !== 'state') return;
    state = e.data;
    $('where').innerHTML = `slide ${state.idx + 1}/${state.total} · step ${state.step}/${state.steps}<br><b>${state.title}</b><br>next: ${state.nextTitle || '—'}`;
    $('notes').innerHTML = state.notes || '<em>No notes for this slide.</em>';
  };
  ch.postMessage({ type: 'hello' });

  setInterval(() => {
    if (!state || !state.timerStart) return;
    const el = (Date.now() - state.timerStart) / 1000;
    $('clock').textContent = fmt(el);
    // Compare against the cumulative data-time budget up to the end of the current slide.
    const budget = state.times.slice(0, state.idx + 1).reduce((a, b) => a + b, 0);
    const pace = $('pace');
    if (el > TOTAL) { pace.className = 'over'; pace.textContent = `over by ${fmt(el - TOTAL)}`; }
    else if (el > budget + 10) { pace.className = 'warn'; pace.textContent = `behind ${fmt(el - budget)}`; }
    else { pace.className = 'ok'; pace.textContent = `${fmt(TOTAL - el)} left`; }
  }, 250);

  $('prev').onclick = () => ch.postMessage({ type: 'nav', dir: -1 });
  $('next').onclick = () => ch.postMessage({ type: 'nav', dir: 1 });
  $('reset').onclick = () => ch.postMessage({ type: 'reset-timer' });
  document.addEventListener('keydown', (e) => {
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { ch.postMessage({ type: 'nav', dir: 1 }); e.preventDefault(); }
    if (['ArrowLeft', 'PageUp'].includes(e.key)) { ch.postMessage({ type: 'nav', dir: -1 }); e.preventDefault(); }
  });
</script>
</body>
</html>
